<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play 'Em</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.3.0/media/hlsjs-video.js"></script> 
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      display: flex;
      height: 100vh;
      background: #121212;
      color: #ffffff;
    }
    #sidebar {
      width: 340px;
      border-right: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      background: #181818;
    }
    #unlock-box {
      padding: 12px;
      margin: 10px 10px 0 10px;
      background: #231d12;
      border: 1px solid #b8860b;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.4;
    }
    #unlock-box a {
      color: #ffd700;
      font-weight: bold;
      text-decoration: underline;
    }
    .token-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    #token-input {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #111;
      color: #fff;
      font-size: 13px;
    }
    #unlock-btn {
      padding: 6px 12px;
      background: #ffd700;
      color: #000;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    #unlock-btn:hover {
      background: #e6c200;
    }
    #token-status {
      margin-top: 6px;
      font-size: 12px;
      color: #ff6b6b;
    }
    #search {
      padding: 12px;
      margin: 10px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #222;
      color: #fff;
      font-size: 14px;
    }
    #channel-list {
      flex: 1;
      overflow-y: auto;
    }
    .channel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid #222;
    }
    .channel-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .channel:hover, .channel.active {
      background: #2c2c2c;
    }
    .channel.locked {
      opacity: 0.6;
    }
    .channel img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      background: #000;
      border-radius: 4px;
    }
    .badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #333;
      color: #ffd700;
      white-space: nowrap;
    }
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    hlsjs-video {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <!-- Payment & Unlock Instructions -->
    <div id="unlock-box">
      <div>
        <strong>🔒 Unlock All Channels:</strong> Pay to unlock restricted channels. 
        <a href="https://your-payment-link.com" target="_blank" rel="noopener noreferrer">Click here to pay and verify your transaction</a> to receive your access token.
      </div>
      <div class="token-row">
        <input type="text" id="token-input" placeholder="Paste your unlock token..." />
        <button id="unlock-btn">Unlock</button>
      </div>
      <div id="token-status"></div>
    </div>

    <input type="text" id="search" placeholder="Search channels..." />
    <div id="channel-list">Loading playlists...</div>
  </div>

  <div id="main">
    <h2 id="now-playing">Select a channel</h2>
    <hlsjs-video id="player" controls autoplay playsinline></hlsjs-video>
  </div>

  <script>
    const player = document.getElementById('player');
    const listContainer = document.getElementById('channel-list');
    const titleDisplay = document.getElementById('now-playing');
    const searchInput = document.getElementById('search');
    const unlockBox = document.getElementById('unlock-box');
    const tokenInput = document.getElementById('token-input');
    const unlockBtn = document.getElementById('unlock-btn');
    const tokenStatus = document.getElementById('token-status');

    // CONFIGURATION
    const LOAD_TIMEOUT_MS = 7000; // Time in ms before an unplaying stream is marked locked
    const VALID_TOKENS = ['VIP-2026-UNLOCK', 'ACCESS-GRANTED-99'];

    let allChannels = [];
    let activeChannel = null;
    let loadTimer = null;
    let isUnlocked = localStorage.getItem('isUnlocked') === 'true';

    if (isUnlocked) {
      unlockBox.style.display = 'none';
    }

    const playlistFiles = ['playlist.m3u', 'athjdf.m3u'];

    Promise.all(
      playlistFiles.map(file =>
        fetch(`${file}?t=${Date.now()}`)
          .then(res => (res.ok ? res.text() : ''))
          .catch(() => '')
      )
    ).then(results => {
      results.forEach(text => {
        if (text) parseM3U(text);
      });

      if (allChannels.length > 0) {
        renderChannels(allChannels);
      } else {
        listContainer.innerHTML = '<p style="padding:14px;">Could not load any playlists.</p>';
      }
    });

    function parseM3U(data) {
      const lines = data.split('\n');
      let currentName = '';
      let currentLogo = '';

      lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const commaIndex = line.lastIndexOf(',');
          currentName = commaIndex !== -1 ? line.slice(commaIndex + 1).trim() : 'Unknown Channel';
          const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
          currentLogo = logoMatch ? logoMatch[1].trim() : '';
        } else if (line.startsWith('http')) {
          allChannels.push({
            name: currentName,
            logo: currentLogo,
            url: line,
            failedToLoad: false
          });
        }
      });
    }

    function markChannelAsLocked(channel) {
      if (!channel || isUnlocked) return;
      channel.failedToLoad = true;
      player.removeAttribute('src');
      titleDisplay.textContent = `🔒 ${channel.name} is Locked — Pay & enter your token on the left to unlock.`;
      
      // Re-render current list preserving search filter
      const term = searchInput.value.toLowerCase();
      const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(term));
      renderChannels(filtered);
    }

    // Listen for stream errors or successful playback
    player.addEventListener('error', () => {
      clearTimeout(loadTimer);
      markChannelAsLocked(activeChannel);
    });

    player.addEventListener('playing', () => {
      clearTimeout(loadTimer);
      if (activeChannel) {
        titleDisplay.textContent = activeChannel.name;
      }
    });

    function renderChannels(channels) {
      listContainer.innerHTML = '';
      channels.forEach(ch => {
        const showLocked = !isUnlocked && ch.failedToLoad;
        const item = document.createElement('div');
        item.className = `channel ${showLocked ? 'locked' : ''} ${activeChannel === ch ? 'active' : ''}`;
        item.innerHTML = `
          <div class="channel-info">
            ${ch.logo ? `<img src="${ch.logo}" referrerpolicy="no-referrer" onerror="this.style.display='none'">` : ''}
            <span>${ch.name}</span>
          </div>
          ${showLocked ? '<span class="badge">LOCKED</span>' : ''}
        `;

        item.onclick = () => {
          clearTimeout(loadTimer);

          // If it already failed once and user hasn't unlocked yet, block immediately
          if (showLocked) {
            titleDisplay.textContent = `🔒 ${ch.name} is Locked — Pay & enter your token on the left to unlock.`;
            player.removeAttribute('src');
            tokenInput.focus();
            return;
          }

          activeChannel = ch;
          document.querySelectorAll('.channel').forEach(el => el.classList.remove('active'));
          item.classList.add('active');
          titleDisplay.textContent = `Loading ${ch.name}...`;
          player.setAttribute('src', ch.url);

          // Start a timeout in case the stream hangs or fails silently
          loadTimer = setTimeout(() => {
            if (player.readyState < 2) {
              markChannelAsLocked(ch);
            }
          }, LOAD_TIMEOUT_MS);
        };

        listContainer.appendChild(item);
      });
    }

    unlockBtn.addEventListener('click', () => {
      const enteredToken = tokenInput.value.trim();
      if (VALID_TOKENS.includes(enteredToken)) {
        isUnlocked = true;
        localStorage.setItem('isUnlocked', 'true');
        unlockBox.style.display = 'none';
        allChannels.forEach(ch => (ch.failedToLoad = false));
        renderChannels(allChannels);
        titleDisplay.textContent = 'All channels unlocked! Select a channel.';
      } else {
        tokenStatus.textContent = 'Invalid token. Please verify your transaction hash first.';
      }
    });

    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(term));
      renderChannels(filtered);
    });
  </script>

</body>
</html>
